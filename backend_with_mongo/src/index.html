<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration Form</title>
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        height:100vh;
        background-image: url('https://media.istockphoto.com/id/1146532466/photo/abstract-blue-digital-background.webp?b=1&s=170667a&w=0&k=20&c=dSA5-nFFQ2szrdDxg8qHy67azMPkshnzPgtBgSsECkY='); /* Specify the path to your background image */
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    form {
        width: 300px;
        margin: auto;
        background-color: rgba(255, 255, 255, 0.8); /* Adding opacity to the form background */
        padding: 20px;
        border-radius: 10px;
        margin-top: 50px;
    }
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="number"] {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        box-sizing: border-box;
    }
    input[type="submit"] {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    input[type="submit"]:hover {
        background-color: #45a049;
    }
</style>
</head>
<body>

<form>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm_password">Confirm Password:</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="number">Phone Number:</label>
    <input type="number" id="number" name="number" required>

    <input type="submit" value="Save">
</form>

</body>
</html>
